x-airflow-common: &airflow-common
  image: mental-health-airflow:latest
  pull_policy: never

  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__PARALLELISM: "2"
    AIRFLOW__DAG_PROCESSOR__PARSING_PROCESSES: "1"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-airflow}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-webserver:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?Set AIRFLOW_JWT_SECRET in .env}
    LOKY_MAX_CPU_COUNT: "1" # Limit GridSearchCV memory use on Docker Desktop.

  volumes:
    - airflow-home:/opt/airflow
    - ./dags:/opt/project/dags:ro
    - ./src:/opt/project/src:ro
    - ./data/raw:/opt/project/data/raw:ro
    - pipeline-results:/home/airflow/student-artifacts

  user: "${AIRFLOW_UID:-50000}:0"

services:

  postgres:
    image: postgres:16

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-airflow}

    volumes:
      - postgres-db-volume:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      retries: 12
      start_period: 5s

    restart: always

 airflow-init:
    <<: *airflow-common
    build: .
    command: [db, migrate]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: [api-server, --workers, "1"]
    ports:
      - "127.0.0.1:${AIRFLOW_PORT:-8081}:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/api/v2/monitor/health"]
      interval: 5s
      retries: 12
      start_period: 10s
    restart: always

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-webserver:
        condition: service_healthy
    restart: always

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: always

volumes:
  airflow-home:
  pipeline-results:
  postgres-db-volume:

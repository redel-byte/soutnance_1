x-airflow: &airflow
  image: soutnance-airflow:3.2.2
  pull_policy: never
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__PARALLELISM: "2"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: admin:admin
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/auth/passwords.json
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api:8080/execution/
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-local-development-jwt-secret-change-me}
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET:-local-development-api-secret-change-me}
    AIRFLOW__DAG_PROCESSOR__PARSING_PROCESSES: "1"
    STUDENT_DATA_PATH: /opt/project/data/student-mental.csv
    STUDENT_WORK_ROOT: /opt/airflow/work
    STUDENT_RESULTS_ROOT: /opt/airflow/results
  restart: unless-stopped

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD, pg_isready, -U, airflow, -d, airflow]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  airflow-init:
    <<: *airflow
    build:
      context: .
      target: airflow
    command: [db, migrate]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  airflow-api:
    <<: *airflow
    command: [api-server, --workers, "1"]
    ports:
      - "127.0.0.1:${AIRFLOW_PORT:-8081}:8080"
    volumes:
      - airflow-auth:/opt/airflow/auth
      - airflow-logs:/opt/airflow/logs
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:8080/api/v2/monitor/health]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  airflow-scheduler:
    <<: *airflow
    command: [scheduler]
    volumes:
      - ./data/raw:/opt/project/data:ro
      - airflow-logs:/opt/airflow/logs
      - pipeline-work:/opt/airflow/work
      - pipeline-results:/opt/airflow/results
    depends_on:
      airflow-api:
        condition: service_healthy

  airflow-dag-processor:
    <<: *airflow
    command: [dag-processor]
    volumes:
      - airflow-logs:/opt/airflow/logs
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  streamlit:
    build:
      context: .
      target: streamlit
    environment:
      STUDENT_RESULTS_ROOT: /opt/airflow/results
    ports:
      - "127.0.0.1:${STREAMLIT_PORT:-8501}:8501"
    volumes:
      - pipeline-results:/opt/airflow/results:ro
    depends_on:
      airflow-scheduler:
        condition: service_started
    healthcheck:
      test: [CMD, python, -c, "from urllib.request import urlopen; urlopen('http://localhost:8501/_stcore/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-data:
  airflow-auth:
  airflow-logs:
  pipeline-work:
  pipeline-results:
